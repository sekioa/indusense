[project]
name = "indusense"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "tabulate>=0.9.0",
]

[project.scripts]
indusense = "indusense:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.10.2",
    "nbformat>=5.10.4",
]
